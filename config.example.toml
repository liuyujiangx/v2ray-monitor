[server]
host = "0.0.0.0"
port = 8000

[v2ray]
api_address = "127.0.0.1:10085"
command = "v2ray"

[dashboard]
refresh_seconds = 2

[auth]
enabled = false
username = "admin"
password = "change-me"

[database]
path = "data/traffic.sqlite3"

[traffic]
# AWS 每月免费出站流量额度，单位 GB。
monthly_quota_gb = 100

[logs]
access_path = "/var/log/v2ray/access.log"
max_lines = 500

[quota]
# 单位是 GB。用户名需要和 V2Ray stats 里的 user 名称一致。
# yujl = 100

[alerts]
enabled = false
# none | email | bark | telegram (后两者尚未实现)
provider = "none"
thresholds = [80, 90, 100]

[alerts.email]
# 网易 163 邮箱（推荐 465 + SSL）：smtp.163.com；password 填「客户端授权码」，不是网页登录密码
# 备选 587 + STARTTLS：smtp_port = 587, use_tls = true, use_ssl = false
# Gmail: smtp.gmail.com, 587, use_tls = true，应用专用密码
# QQ: smtp.qq.com, 465, use_ssl = true，SMTP 授权码
smtp_host = "smtp.163.com"
smtp_port = 465
use_tls = false
use_ssl = true
username = "your-name@163.com"
password = "your-163-client-auth-code"
from_addr = "your-name@163.com"
to_addrs = ["notify@example.com"]
